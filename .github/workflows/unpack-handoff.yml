name: Unpack CAD handoff

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f CAD_Project_Handoff.zip
          tmp="$(mktemp -d)"
          unzip -q CAD_Project_Handoff.zip -d "$tmp"
          cp -a "$tmp"/. .
          rm -f CAD_Project_Handoff.zip
          rm -rf "$tmp"
      - name: Commit unpacked project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Unpack CAD project handoff"
            git push
          fi